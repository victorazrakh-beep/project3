<html lang="es">
<head>

  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-route="ahora">
  <div class="intro" id="intro" aria-label="Nos Movimo' Broder">
    <div class="intro-stage">
      <canvas class="intro-trace" aria-hidden="true"></canvas>
      <h1 class="intro-title"><span class="l1"><span class="w"><span style="--i:0">N</span><span style="--i:1">O</span><span style="--i:2">S</span></span></span><span class="l1b"><span class="w"><span style="--i:3">M</span><span style="--i:4">O</span><span style="--i:5">V</span><span style="--i:6">I</span><span style="--i:7">M</span><span style="--i:8">O</span><span style="--i:9">’</span></span></span><span class="l2"><span class="w"><span style="--i:10">B</span><span style="--i:11">R</span><span style="--i:12">O</span><span style="--i:13">D</span><span style="--i:14">E</span><span style="--i:15">R</span></span></span></h1>
      <p class="intro-sub"><span>Panamá</span><span>9 · X · 2026</span><span>M7.7</span></p>
    </div>
    <button class="intro-skip" type="button">Toca para entrar</button>
  </div>
  <div id="map" aria-label="Mapa del sismo y sus réplicas"></div>
  <div class="map-fade" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Onda, inicio">
      <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M3 17h5l3-9 4 17 4-13 3 5h7" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#7fd4ff"/><stop offset=".55" stop-color="#ffb547"/><stop offset="1" stop-color="#ff4d3d"/></linearGradient></defs></svg>
      <span>Onda</span>
    </a>
    <button class="event-chip" id="event-chip" aria-label="Cambiar de sismo"><span class="skeleton"></span></button>
  </header>

  <main class="panel" id="view" tabindex="-1">
    <div class="loading"><span class="loader"></span><p>Conectando con los sismógrafos…</p></div>
  </main>

  <nav class="tabs" aria-label="Secciones">
    <a href="#/" data-route=""><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7.5" class="o"/><circle cx="12" cy="12" r="11" class="o2"/></svg><span>Ahora</span></a>
    <a href="#/tu" data-route="tu"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" class="o"/><circle cx="12" cy="9.5" r="2.6"/></svg><span>Tú</span></a>
    <a href="#/ciudades" data-route="ciudades"><svg viewBox="0 0 24 24"><path d="M3 21V10l5-3v14M8 21V4l7 3v14M15 21v-9l6 2v7M2 21h20" class="o"/></svg><span>Ciudades</span></a>
    <a href="#/casa" data-route="casa"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v10H3z" class="o"/><path d="M10 21v-6h4v6" class="o"/></svg><span>Casa</span></a>
    <a href="#/ciencia" data-route="ciencia"><svg viewBox="0 0 24 24"><path d="M2 12h3l2-6 3 12 3-9 2 5 2-2h5" class="o"/></svg><span>Ciencia</span></a>

  <div class="sheet-backdrop" id="picker" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="picker-title">
      <div class="sheet-head"><h2 id="picker-title">Otros sismos recientes</h2><button class="link" data-close>Cerrar</button></div>
      <div class="sheet-body" id="picker-list"></div>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/intro.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
