name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Refresh the Universidad de Panamá aftershock list (their site doesn't allow browser requests).
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Refresh local network data
        run: python3 tools/fetch_up.py data/up.json || echo "Keeping the committed copy"
      - name: Stamp file versions so browsers fetch fresh code after each deploy
        run: |
          v=${GITHUB_SHA::7}
          perl -pi -e "s#(from '\.\.?/[\w/.-]+\.js)'#\$1?v=$v'#g" $(find js -name '*.js')
          perl -pi -e "s#\"((?:css|js)/[\w/.-]+\.(?:js|css))\"#\"\$1?v=$v\"#g" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
